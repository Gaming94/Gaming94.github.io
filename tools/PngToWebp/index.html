<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>PNG to WebP 변환기 | KAOR NOTE</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --accent: #e0e0e0;
      --border: #333333;
      --text: #ffffff;
      --text-sub: #888888;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }
    .converter-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 30px;
      max-width: 600px;
      width: 100%;
    }
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .drop-zone.dragover {
      border-color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
    }
    .controls {
      margin: 20px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-sub);
      font-size: 0.9rem;
    }
    .file-list {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .download-btn {
      color: #fff;
      text-decoration: none;
      background: #333;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.8rem;
    }
    .download-btn:hover { background: #555; }
  </style>
</head>
<body>

<div class="converter-card">
  <h2>PNG → WebP 변환</h2>
  <p style="color: var(--text-sub); font-size: 0.9rem; margin-bottom: 20px;">
    서버로 업로드되지 않고 내 브라우저에서 안전하게 무제한 변환됩니다.
  </p>

  <div class="controls">
    <label for="quality">압축 품질 (Quality): <span id="quality-val">85%</span></label>
    <input type="range" id="quality" min="10" max="100" value="85">
  </div>

  <div class="drop-zone" id="drop-zone">
    PNG 파일들을 여기에 드래그하거나 클릭하여 선택하세요
    <input type="file" id="file-input" accept="image/png" multiple style="display: none;">
  </div>

  <div class="file-list" id="file-list"></div>
</div>

<script>
  const dropZone = document.getElementById('drop-zone');
  const fileInput = document.getElementById('file-input');
  const fileList = document.getElementById('file-list');
  const qualitySlider = document.getElementById('quality');
  const qualityVal = document.getElementById('quality-val');

  qualitySlider.addEventListener('input', (e) => {
    qualityVal.textContent = `${e.target.value}%`;
  });

  dropZone.addEventListener('click', () => fileInput.click());

  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });

  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    processFiles(e.dataTransfer.files);
  });

  fileInput.addEventListener('change', (e) => processFiles(e.target.files));

  function processFiles(files) {
    const quality = parseFloat(qualitySlider.value) / 100;

    Array.from(files).forEach(file => {
      if (!file.type.match('image/png')) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);

          canvas.toBlob((blob) => {
            const outputName = file.name.replace(/\.png$/i, '') + '.webp';
            const originalSize = (file.size / 1024).toFixed(1);
            const newSize = (blob.size / 1024).toFixed(1);
            const downloadUrl = URL.createObjectURL(blob);

            const item = document.createElement('div');
            item.className = 'file-item';
            item.innerHTML = `
              <span>${outputName} <small style="color: var(--text-sub);">(${originalSize}KB → ${newSize}KB)</small></span>
              <a href="${downloadUrl}" download="${outputName}" class="download-btn">다운로드</a>
            `;
            fileList.appendChild(item);
          }, 'image/webp', quality);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });
  }
</script>

</body>
</html>
